{% extends "base.html" %}

{% block title %}
    Check Your Email | CollegeEvents
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm auth-card">

                    <div class="card-body p-4 text-center">

                        <h1 class="h3 fw-bold mb-3">
                            Check Your Email
                        </h1>

                        <p class="text-muted mb-4">
                            If an account exists with the email address
                            you entered, we've sent instructions to reset
                            your password.
                        </p>

                        <a href="{% url 'login' %}"
                           class="btn btn-primary w-100">
                            Back to Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


    {% endblock %}
